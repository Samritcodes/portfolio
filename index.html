<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#29251d">
  <meta
    name="description"
    content="Samrit Kumar Bhutia — Full-Stack AI Engineer & Creative Software Developer Portfolio"
  >
  <title>Samrit Kumar Bhutia — Field Manuals</title>
  
  <!-- Font Awesome Icons for Project & Social Links -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --ink: #29251d;
      --ink-deep: #1d1a15;
      --ink-soft: #3a382b;
      --pink: #c3a47b;
      --pink-bright: #dbc39c;
      --text: #eee2ca;
      --muted: #c5b79e;
      --periwinkle: #b7976c;
      --sage: #89946f;
      --clay: #a96346;
      --moss: #5f684f;
      --paper: #eadfc7;
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua",
        Baskerville, Georgia, serif;
      --ease: cubic-bezier(.2, .78, .2, 1);
      --mx: 0px;
      --my: 0px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: var(--ink);
    }

    body {
      min-height: 100svh;
      overflow: hidden;
      color: var(--text);
      font-family: var(--serif);
      -webkit-font-smoothing: antialiased;
      cursor: default;
    }

    button,
    a {
      font: inherit;
      color: inherit;
    }

    .stage {
      position: relative;
      isolation: isolate;
      width: 100%;
      min-height: 100svh;
      overflow: hidden;
      background:
        radial-gradient(circle at 49% 84%, rgba(117, 102, 71, .2), transparent 34%),
        radial-gradient(circle at 14% 4%, rgba(100, 112, 77, .12), transparent 28%),
        linear-gradient(180deg, #343025 0%, var(--ink) 48%, #211e18 100%);
    }

    .stage::after {
      content: "";
      position: absolute;
      z-index: 30;
      inset: 0;
      pointer-events: none;
      opacity: .14;
      background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.86' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.22'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light;
    }

    .topbar {
      position: fixed;
      z-index: 50;
      top: 0;
      left: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 26px 3.2vw;
      pointer-events: none;
    }

    .brand {
      color: var(--pink);
      font-size: clamp(23px, 2.1vw, 30px);
      font-style: italic;
      font-weight: 600;
      letter-spacing: -.035em;
      line-height: 1;
      text-decoration: none;
      pointer-events: auto;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: auto;
    }

    .icon-button,
    .ticket-button,
    .close-button,
    .pill,
    .book-card {
      border: 0;
      outline: 0;
      -webkit-tap-highlight-color: transparent;
    }

    .icon-button,
    .ticket-button {
      height: 50px;
      border: 1px solid rgba(61, 49, 35, .18);
      background: var(--paper);
      color: #30291f;
      box-shadow: 0 8px 26px rgba(28, 22, 14, .13);
      transition: transform 240ms var(--ease), background-color 240ms ease;
    }

    .icon-button {
      display: grid;
      width: 50px;
      place-items: center;
      border-radius: 50%;
      cursor: pointer;
    }

    .menu-glyph {
      position: relative;
      width: 14px;
      height: 10px;
    }

    .menu-glyph::before,
    .menu-glyph::after {
      content: "";
      position: absolute;
      left: 1px;
      width: 12px;
      height: 2px;
      border-radius: 2px;
      background: currentColor;
      transition: transform 300ms var(--ease), top 300ms var(--ease);
    }

    .menu-glyph::before {
      top: 2px;
    }

    .menu-glyph::after {
      top: 7px;
    }

    [data-menu="open"] .menu-glyph::before {
      top: 5px;
      transform: rotate(45deg);
    }

    [data-menu="open"] .menu-glyph::after {
      top: 5px;
      transform: rotate(-45deg);
    }

    .ticket-button {
      display: inline-grid;
      min-width: 138px;
      padding: 0 25px;
      place-items: center;
      border-radius: 999px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      text-decoration: none;
    }

    .icon-button:hover,
    .ticket-button:hover {
      transform: translateY(-3px);
      background: #f7edd9;
    }

    .icon-button:focus-visible,
    .ticket-button:focus-visible,
    .close-button:focus-visible,
    .pill:focus-visible,
    .menu-link:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 4px;
    }

    .hero-word {
      position: absolute;
      z-index: 1;
      top: 11.5vh;
      left: 50%;
      margin: 0;
      color: var(--pink);
      font-size: clamp(160px, 20vw, 310px);
      font-style: italic;
      font-weight: 500;
      letter-spacing: -.085em;
      line-height: .84;
      white-space: nowrap;
      transform: translate3d(calc(-50% + var(--mx) * -.12), calc(var(--my) * -.12), 0);
      transition: opacity 700ms ease, filter 700ms ease, transform 900ms var(--ease);
      user-select: none;
    }

    .gallery {
      position: absolute;
      z-index: 5;
      inset: 0;
      perspective: 1400px;
      transform-style: flat;
    }

    .book-card {
      --hover-y: 0px;
      --local-x: 0px;
      --local-y: 0px;
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: var(--w);
      aspect-ratio: .672 / 1;
      padding: 0;
      background: transparent;
      cursor: pointer;
      transform:
        translate3d(
          calc(-50% + var(--local-x)),
          calc(var(--hover-y) + var(--local-y)),
          0
        )
        rotate(var(--r))
        rotateY(var(--yaw));
      transform-style: preserve-3d;
      transition:
        left 1100ms var(--ease),
        top 1100ms var(--ease),
        width 1100ms var(--ease),
        opacity 500ms ease,
        filter 500ms ease,
        transform 520ms var(--ease);
      will-change: transform, left, top, width;
    }

    .book-card[data-book="intro"] {
      --x: 23.2%;
      --y: 40.5%;
      --w: min(30.5vw, 435px);
      --r: -8deg;
      --yaw: -7deg;
      z-index: 1;
    }

    .book-card[data-book="projects"] {
      --x: 50%;
      --y: 32.2%;
      --w: min(33vw, 470px);
      --r: .8deg;
      --yaw: -3deg;
      z-index: 3;
    }

    .book-card[data-book="skills"] {
      --x: 77%;
      --y: 42%;
      --w: min(30.5vw, 435px);
      --r: 8deg;
      --yaw: 7deg;
      z-index: 2;
    }

    .book-card:hover,
    .book-card[data-hovered="true"] {
      --hover-y: -28px;
      z-index: 8;
    }

    .book {
      position: relative;
      display: block;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 800ms var(--ease);
    }

    .book-card:hover .book {
      transform: scale(1.035) rotateX(-1.5deg);
    }

    .book-back,
    .page-block,
    .page-fan,
    .front-cover,
    .book-shadow {
      position: absolute;
      inset: 0;
      border-radius: 3px 7px 7px 3px;
    }

    .book-shadow {
      z-index: -2;
      inset: 5% -4% -2% 4%;
      border-radius: 12px;
      background: rgba(24, 18, 10, .7);
      filter: blur(22px);
      opacity: .72;
      transform: translate3d(18px, 28px, -60px);
    }

    .book-back {
      z-index: 0;
      background: var(--cover-color);
      box-shadow: 0 18px 30px rgba(24, 18, 10, .4);
      transform: translate3d(7px, 1px, -26px);
    }

    .page-block {
      z-index: 1;
      inset: 1.7% 1.4% 1.7% 3.8%;
      overflow: visible;
      border: 1px solid rgba(84, 68, 45, .25);
      border-radius: 2px 5px 5px 2px;
      background:
        repeating-linear-gradient(
          0deg,
          rgba(105, 86, 58, .14) 0,
          rgba(105, 86, 58, .14) 1px,
          transparent 1px,
          transparent 2.8px
        ),
        linear-gradient(90deg, #cfc1a4 0%, #f2e8d2 14%, #e7dac0 87%, #cbb894 100%);
      box-shadow: 7px 5px 16px rgba(31, 23, 13, .26);
      transform: translate3d(7px, 1px, -12px);
      transition: transform 1100ms var(--ease), inset 1100ms var(--ease);
    }

    .page-block::before {
      content: "";
      position: absolute;
      top: -7px;
      right: 1px;
      left: 1px;
      height: 8px;
      border-radius: 2px 4px 0 0;
      background:
        repeating-linear-gradient(
          90deg,
          #d9cbae 0,
          #d9cbae 2px,
          #f2e7cf 2px,
          #f2e7cf 5px
        );
      transform: skewX(-8deg);
      transform-origin: bottom left;
    }

    .page-block::after {
      content: "";
      position: absolute;
      top: 0;
      right: -7px;
      width: 8px;
      height: 100%;
      border-radius: 0 4px 4px 0;
      background:
        repeating-linear-gradient(
          0deg,
          #cbb995 0,
          #cbb995 1px,
          #eee3cd 1px,
          #eee3cd 3px
        );
      box-shadow: 3px 2px 7px rgba(35, 26, 14, .18);
      transform: skewY(-2deg);
      transform-origin: left center;
    }

    .page-fan {
      z-index: 2;
      inset: 2.4% 2% 2.4% 4.3%;
      pointer-events: none;
      transform-style: preserve-3d;
    }

    .page-fan i {
      position: absolute;
      inset: 0;
      display: block;
      border: 1px solid rgba(102, 83, 55, .22);
      border-radius: 2px 5px 5px 2px;
      background:
        linear-gradient(90deg, rgba(116, 91, 56, .22), transparent 9%),
        repeating-linear-gradient(
          0deg,
          #f0e6d0 0,
          #f0e6d0 2px,
          #e6d8ba 2px,
          #e6d8ba 3px
        );
      box-shadow: 3px 5px 10px rgba(37, 28, 16, .08);
      opacity: 0;
      transform: translate3d(0, 0, 0) rotateY(0);
      transform-origin: 1.5% center;
      transition: opacity 500ms ease, transform 1200ms var(--ease);
    }

    .front-cover {
      z-index: 3;
      overflow: hidden;
      border: 1px solid rgba(238, 224, 194, .2);
      background-color: var(--cover-color);
      background-image: var(--cover);
      background-position: center;
      background-size: cover;
      box-shadow:
        0 25px 38px rgba(24, 18, 10, .4),
        inset -12px 0 18px rgba(0, 0, 0, .16),
        inset 4px 0 9px rgba(255, 255, 255, .12);
      transform: translate3d(0, 0, 12px);
      transform-origin: 1.5% center;
      transform-style: preserve-3d;
      transition: transform 1200ms var(--ease), box-shadow 600ms ease;
    }

    .front-cover::before {
      content: "";
      position: absolute;
      z-index: 3;
      top: 0;
      bottom: 0;
      left: 0;
      width: 5.5%;
      background:
        linear-gradient(
          90deg,
          rgba(0, 0, 0, .35),
          rgba(255, 255, 255, .08) 35%,
          rgba(0, 0, 0, .12) 75%,
          transparent
        );
      mix-blend-mode: multiply;
      opacity: .8;
    }

    .front-cover::after {
      content: "";
      position: absolute;
      z-index: 4;
      inset: 0;
      border: 3px solid rgba(255, 255, 255, .04);
      border-radius: inherit;
      pointer-events: none;
    }

    .cover-motion {
      position: absolute;
      z-index: 1;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 420ms ease;
      pointer-events: none;
    }

    .cover-motion[data-ready="true"] {
      opacity: 1;
    }

    .cover-copy {
      position: absolute;
      z-index: 2;
      inset: 5.8% 7.5% 5.5%;
      display: grid;
      grid-template-rows: auto auto auto 1fr auto;
      align-content: start;
      color: var(--cover-ink);
      text-align: center;
      text-shadow: 0 1px 0 rgba(241, 226, 196, .24);
    }

    .cover-kicker {
      font-size: clamp(8px, .72vw, 11px);
      font-style: italic;
      font-weight: 600;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .cover-title {
      margin-top: 2.2%;
      font-size: clamp(35px, 4.3vw, 64px);
      font-weight: 600;
      letter-spacing: -.055em;
      line-height: .9;
    }

    .cover-subtitle {
      margin-top: 3%;
      font-size: clamp(10px, 1.05vw, 15px);
      font-style: italic;
      font-weight: 600;
      letter-spacing: .035em;
    }

    .cover-footer {
      align-self: end;
      padding-top: 3%;
      border-top: 1px solid currentColor;
      font-size: clamp(7px, .62vw, 9px);
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .book-card[data-book="intro"] .cover-copy {
      --cover-ink: #31291e;
    }

    .book-card[data-book="projects"] .cover-copy {
      --cover-ink: #4b281a;
    }

    .book-card[data-book="skills"] .cover-copy {
      --cover-ink: #293024;
    }

    .open-badge {
      position: absolute;
      z-index: 6;
      top: 47%;
      left: 50%;
      display: grid;
      width: 94px;
      height: 66px;
      place-items: center;
      color: #312a21;
      background: #efe3ca;
      clip-path: polygon(
        3% 22%, 10% 8%, 25% 7%, 38% 1%, 51% 6%, 66% 2%,
        77% 10%, 92% 11%, 96% 26%, 100% 39%, 95% 52%, 99% 67%,
        88% 79%, 83% 93%, 68% 94%, 55% 100%, 42% 94%, 27% 98%,
        17% 88%, 4% 84%, 5% 69%, 0 57%, 5% 43%, 1% 34%
      );
      font-size: 11px;
      font-style: italic;
      font-weight: 700;
      letter-spacing: .12em;
      opacity: 0;
      transform: translate(-50%, -50%) scale(.76) rotate(-3deg);
      transition: opacity 260ms ease, transform 420ms var(--ease), filter 260ms ease;
      pointer-events: none;
    }

    .book-card:hover .open-badge,
    .book-card[data-hovered="true"] .open-badge,
    .book-card:focus-visible .open-badge {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1) rotate(-3deg);
    }

    .book-card:focus-visible {
      outline: 0;
    }

    .book-card:focus-visible .open-badge {
      filter:
        drop-shadow(0 7px 12px rgba(29, 22, 14, .34))
        drop-shadow(0 0 8px rgba(224, 190, 137, .28));
    }

    .detail-panel {
      position: absolute;
      z-index: 12;
      top: 14.5%;
      right: 4.5%;
      width: min(47.5%, 650px);
      opacity: 0;
      transition: opacity 520ms ease 280ms;
      pointer-events: none;
    }

    .detail-title {
      margin: 0 0 20px;
      color: var(--pink);
      font-size: clamp(48px, 5.2vw, 76px);
      font-style: italic;
      font-weight: 500;
      letter-spacing: -.055em;
      line-height: .96;
    }

    .detail-description {
      max-width: 600px;
      margin: 0;
      color: var(--muted);
      font-size: clamp(14px, 1.28vw, 17px);
      line-height: 1.64;
    }

    .detail-scroll {
      max-height: clamp(340px, calc(100svh - 450px), 600px);
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 0 22px 76px 0;
      -webkit-mask-image: linear-gradient(
        to bottom,
        #000 0,
        #000 calc(100% - 76px),
        transparent 100%
      );
      mask-image: linear-gradient(
        to bottom,
        #000 0,
        #000 calc(100% - 76px),
        transparent 100%
      );
      scrollbar-color: rgba(198, 139, 140, .76) rgba(73, 66, 49, .35);
      scrollbar-width: thin;
    }

    .detail-scroll:focus-visible {
      border-radius: 8px;
      outline: 1px solid rgba(231, 184, 185, .7);
      outline-offset: 8px;
    }

    .detail-scroll::-webkit-scrollbar {
      width: 5px;
    }

    .detail-scroll::-webkit-scrollbar-track {
      border-radius: 999px;
      background: rgba(73, 66, 49, .35);
    }

    .detail-scroll::-webkit-scrollbar-thumb {
      border-radius: 999px;
      background: rgba(198, 139, 140, .76);
    }

    .doc-section {
      margin-top: 26px;
      padding-top: 22px;
      border-top: 1px solid rgba(220, 200, 164, .2);
    }

    .doc-label {
      margin: 0 0 16px;
      color: var(--pink);
      font-size: 12px;
      font-style: italic;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .doc-steps {
      display: grid;
      gap: 18px;
      margin: 0;
      padding: 0;
      list-style: none;
      counter-reset: guide-step;
    }

    .doc-steps li {
      display: grid;
      grid-template-columns: 34px 1fr;
      gap: 12px;
      counter-increment: guide-step;
    }

    .doc-steps li::before {
      content: counter(guide-step, decimal-leading-zero);
      padding-top: 2px;
      color: rgba(231, 184, 185, .7);
      font-size: 12px;
      font-style: italic;
      letter-spacing: .08em;
    }

    .doc-step-copy {
      display: grid;
      gap: 4px;
    }

    .doc-step-copy strong {
      color: #e8dcc4;
      font-size: 15px;
      font-style: italic;
      font-weight: 650;
    }

    .doc-step-copy span,
    .doc-review {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.58;
    }

    /* Interactive Project Cards inside Book 2 */
    .project-entry {
      padding: 16px;
      border: 1px solid rgba(220, 200, 164, .2);
      border-radius: 12px;
      background: rgba(52, 48, 37, .45);
      transition: background 200ms ease, border-color 200ms ease, transform 200ms var(--ease);
    }

    .project-entry:hover {
      background: rgba(62, 56, 42, .65);
      border-color: rgba(220, 200, 164, .38);
      transform: translateY(-2px);
    }

    .project-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .project-title {
      color: #f2e7cf;
      font-size: 16px;
      font-style: italic;
      font-weight: 700;
    }

    .project-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(234, 223, 199, .15);
      color: var(--text);
      font-size: 11px;
      font-family: ui-monospace, SFMono-Regular, monospace;
      text-decoration: none;
      transition: background 200ms ease;
    }

    .project-link:hover {
      background: rgba(234, 223, 199, .3);
      color: #fff;
    }

    .project-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .tag-badge {
      padding: 2px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, .25);
      color: var(--pink-bright);
      font-size: 10px;
      font-family: ui-monospace, SFMono-Regular, monospace;
      letter-spacing: .04em;
    }

    .prompt-block {
      padding: 17px 18px;
      border: 1px solid rgba(220, 200, 164, .2);
      border-radius: 12px;
      background: rgba(52, 48, 37, .62);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .035);
    }

    .prompt-block code {
      color: #e8dcc4;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      line-height: 1.58;
      white-space: pre-wrap;
    }

    .doc-review {
      margin: 0;
    }

    .meta-row {
      display: grid;
      grid-template-columns: max-content 1px max-content 1fr;
      align-items: center;
      gap: clamp(16px, 2vw, 27px);
      margin-top: 22px;
      color: var(--pink);
    }

    .stars {
      display: flex;
      gap: 8px;
      font-size: 24px;
      letter-spacing: .02em;
      line-height: 1;
    }

    .stars .dim {
      color: #665f4d;
    }

    .meta-divider {
      width: 1px;
      height: 26px;
      background: rgba(220, 200, 164, .28);
    }

    .review-source,
    .year {
      color: #bcae92;
      font-size: 18px;
      font-style: italic;
      font-weight: 650;
    }

    .year {
      justify-self: end;
    }

    .detail-rule {
      height: 1px;
      margin: 10px 0 22px;
      border: 0;
      background: rgba(220, 200, 164, .24);
    }

    .bottom-dock {
      position: fixed;
      z-index: 24;
      right: 4.5%;
      bottom: 28px;
      width: min(47.5%, 650px);
    }

    .bottom-dock .meta-row {
      margin: 0 10px;
    }

    .bottom-dock .detail-rule {
      margin: 10px 8px 14px;
    }

    .action-rail {
      --action-inset: 8px;
      display: flex;
      align-items: center;
      gap: var(--action-inset);
      width: 100%;
      padding: var(--action-inset);
      border: 1px solid rgba(238, 226, 202, .07);
      border-radius: 32px;
      background: rgba(64, 58, 43, .88);
      box-shadow: 0 16px 32px rgba(26, 20, 12, .2);
      backdrop-filter: blur(12px);
    }

    .pill {
      display: inline-flex;
      flex: 1 1 0;
      align-items: center;
      justify-content: center;
      min-width: 0;
      min-height: 58px;
      padding: 0 18px;
      border-radius: 24px;
      background: var(--periwinkle);
      color: #2e261d;
      cursor: pointer;
      font-size: 15px;
      font-style: italic;
      font-weight: 700;
      white-space: nowrap;
      text-decoration: none;
      transition: transform 220ms var(--ease), filter 220ms ease, background 220ms ease;
    }

    .pill:hover {
      transform: translateY(-2px);
      filter: brightness(1.06);
    }

    .pill.language {
      gap: 10px;
      background: var(--paper);
    }

    .pill.language svg {
      width: 19px;
      height: 19px;
    }

    .pill.icon-only {
      flex: 0 0 58px;
      width: 58px;
      min-width: 58px;
      padding: 0;
      background: #565d45;
      color: #f1e6cf;
    }

    .pill.icon-only svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      transition: fill 220ms ease;
    }

    .pill.icon-only[aria-pressed="true"] svg {
      fill: var(--pink);
      stroke: var(--pink);
    }

    .close-button {
      position: absolute;
      z-index: 52;
      top: 30px;
      left: 50%;
      display: grid;
      width: 54px;
      height: 54px;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, .26);
      border-radius: 50%;
      background: rgba(42, 37, 28, .28);
      color: var(--paper);
      cursor: pointer;
      font-size: 27px;
      font-weight: 200;
      opacity: 0;
      transform: translate3d(-50%, -18px, 0) rotate(-45deg);
      transition: opacity 400ms ease, transform 620ms var(--ease), background 220ms ease;
      pointer-events: none;
      backdrop-filter: blur(8px);
    }

    .close-button:hover {
      background: rgba(255, 255, 255, .08);
    }

    .blossom-field {
      position: absolute;
      z-index: 9;
      inset: 0;
      overflow: hidden;
      opacity: 0;
      transition: opacity 700ms ease 250ms;
      pointer-events: none;
    }

    .blossom {
      --blossom-size: 26px;
      position: absolute;
      top: -12vh;
      left: var(--blossom-x);
      width: var(--blossom-size);
      height: var(--blossom-size);
      opacity: .92;
      transform-style: preserve-3d;
      animation: blossomFall var(--blossom-duration) linear var(--blossom-delay) infinite;
    }

    .blossom i {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 42%;
      height: 60%;
      border-radius: 72% 72% 58% 58%;
      background:
        radial-gradient(circle at 50% 82%, rgba(187, 103, 108, .9) 0 10%, transparent 11%),
        linear-gradient(180deg, #f5d8d3 0%, #e6aaa9 74%, #c78184 100%);
      box-shadow: inset 1px 1px 0 rgba(255, 255, 255, .42);
      transform-origin: 50% 100%;
    }

    .blossom i:nth-child(1) { transform: translate(-50%, -100%) rotate(0deg); }
    .blossom i:nth-child(2) { transform: translate(-50%, -100%) rotate(72deg); }
    .blossom i:nth-child(3) { transform: translate(-50%, -100%) rotate(144deg); }
    .blossom i:nth-child(4) { transform: translate(-50%, -100%) rotate(216deg); }
    .blossom i:nth-child(5) { transform: translate(-50%, -100%) rotate(288deg); }

    .blossom::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 18%;
      height: 18%;
      border-radius: 50%;
      background: #d9b46f;
      box-shadow: 0 0 0 2px rgba(107, 70, 51, .18);
      transform: translate(-50%, -50%);
    }

    @keyframes blossomFall {
      0% { transform: translate3d(0, -10vh, 0) rotateX(18deg) rotateZ(var(--blossom-r)); }
      32% { transform: translate3d(36px, 34vh, 0) rotateX(154deg) rotateZ(calc(var(--blossom-r) + 126deg)); }
      68% { transform: translate3d(-30px, 78vh, 0) rotateX(284deg) rotateZ(calc(var(--blossom-r) + 272deg)); }
      100% { transform: translate3d(20px, 122vh, 0) rotateX(430deg) rotateZ(calc(var(--blossom-r) + 430deg)); }
    }

    .menu-layer {
      position: fixed;
      z-index: 40;
      inset: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 47%, rgba(111, 91, 61, .22), transparent 42%),
        rgba(30, 27, 21, .95);
      opacity: 0;
      transition: opacity 460ms ease;
      pointer-events: none;
      backdrop-filter: blur(18px);
    }

    .menu-list {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .menu-link {
      display: inline-block;

      font-style: italic;
      font-weight: 500;
      letter-spacing: -.055em;
      line-height: 1.05;
      text-decoration: none;
      transform: translateY(24px);
      transition: color 200ms ease, transform 500ms var(--ease);
    }

    .menu-link:hover { color: #fff; }

    [data-menu="open"] .menu-layer {
      opacity: 1;
      pointer-events: auto;
    }

    [data-menu="open"] .menu-link {
      transform: translateY(0);
    }

    .toast {
      position: fixed;
      z-index: 80;
      bottom: 22px;
      left: 50%;
      max-width: calc(100vw - 32px);
      padding: 12px 18px;
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 999px;
      background: rgba(36, 32, 25, .88);
      color: var(--paper);
      box-shadow: 0 12px 36px rgba(0, 0, 0, .22);
      font-size: 13px;
      font-weight: 650;
      opacity: 0;
      transform: translate(-50%, 20px);
      transition: opacity 250ms ease, transform 350ms var(--ease);
      pointer-events: none;
      backdrop-filter: blur(12px);
    }

    .toast[data-show="true"] {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    [data-mode="detail"] .hero-word {
      opacity: 0;
      filter: blur(16px);
      transform: translate3d(-50%, -34px, 0) scale(.9);
    }

    [data-mode="detail"] .book-card:not(.selected) {
      opacity: 0;
      filter: blur(10px);
      transform: translate3d(-50%, 60vh, -200px) rotate(var(--r)) scale(.8);
      pointer-events: none;
    }

    [data-mode="detail"] .book-card.selected {
      --hover-y: 0px;
      --local-x: 0px;
      --local-y: 0px;
      --detail-yaw: -5deg;
      --detail-pitch: 0deg;
      left: 27%;
      top: 50%;
      width: min(30vw, 415px);
      z-index: 14;
      cursor: default;
      transform: translate3d(-50%, -50%, 0) rotate(-3deg);
      pointer-events: none;
    }

    [data-mode="detail"] .book-card.selected .book {
      transform: scale(1.02) rotateX(var(--detail-pitch)) rotateY(var(--detail-yaw));
      transition-duration: 170ms;
      transition-timing-function: cubic-bezier(.2, .78, .2, 1);
    }

    [data-mode="detail"] .book-card.selected .front-cover {
      box-shadow:
        25px 26px 44px rgba(29, 21, 11, .34),
        inset -12px 0 18px rgba(0, 0, 0, .13),
        inset 4px 0 9px rgba(255, 255, 255, .1);
      transform: translate3d(0, 0, 18px) rotateY(-29deg);
    }

    [data-mode="detail"] .book-card.selected .page-block {
      inset: 1.9% 1.5% 1.9% 4.4%;
      transform: translate3d(6px, 1px, -11px);
    }

    [data-mode="detail"] .book-card.selected .page-fan i {
      opacity: 1;
    }

    [data-mode="detail"] .book-card.selected .page-fan i:nth-child(1) {
      transform: translate3d(0, 0, 10px) rotateY(-4deg);
    }

    [data-mode="detail"] .book-card.selected .page-fan i:nth-child(2) {
      transform: translate3d(0, 0, 11px) rotateY(-8deg);
    }

    [data-mode="detail"] .book-card.selected .page-fan i:nth-child(3) {
      transform: translate3d(0, 0, 12px) rotateY(-12deg);
    }

    [data-mode="detail"] .book-card.selected .page-fan i:nth-child(4) {
      transform: translate3d(0, 0, 13px) rotateY(-16deg);
    }

    [data-mode="detail"] .book-card.selected .open-badge {
      opacity: 0;
    }

    [data-mode="detail"] .detail-panel {
      opacity: 1;
      pointer-events: auto;
    }

      transition-delay: 0ms;

      transform: translate3d(-50%, 0, 0) rotate(0);

    }

      }

      [data-mode="detail"] .book-card.selected {
        left: 50%;
        top: 50svh;

      }

      .detail-panel {
        top: calc(100svh + 48px);
        right: 7%;
        left: 7%;
        width: auto;
        padding-bottom: 130px;
      }

      .detail-scroll {
        max-height: min(500px, calc(100svh - 310px));
      }

      .detail-title {
        font-size: clamp(44px, 9vw, 64px);
      }

      .bottom-dock {
        right: 20px;
        bottom: 20px;
        left: 20px;
        width: auto;
      }

      .action-rail {
        overflow-x: auto;
        scrollbar-width: none;
      }

      .action-rail::-webkit-scrollbar {
        display: none;
      }

      .pill {
        min-width: 132px;
      }

      .pill.icon-only {
        min-width: 58px;
      }
    }

    @media (max-width: 560px) {
      .brand {
        font-size: 22px;
      }

      .ticket-button {
        display: none;
      }

      .hero-word {
        top: 22vh;

        --w: 66vw;
      }

      .book-card[data-book="projects"] {
        --x: 50%;
        --y: 40%;
        --w: 72vw;
      }

      .book-card[data-book="skills"] {
        --x: 96%;
        --y: 46%;
        --w: 66vw;
      }

      [data-mode="detail"] .stage {
        min-height: calc(100svh + 840px);
      }

      [data-mode="detail"] .book-card.selected {
        width: min(67vw, 315px);
      }

      .detail-panel {
        right: 20px;
        left: 20px;
      }

      .detail-scroll {
        padding-right: 14px;
      }

      .pill {
        min-width: 0;
        min-height: 54px;
        padding: 0 10px;
        font-size: 12px;
      }

      .pill.language svg {
        display: none;
      }

      .pill.icon-only {
        flex-basis: 54px;
        width: 54px;
        min-width: 54px;
      }

      .meta-row {
        grid-template-columns: max-content 1px 1fr;
      }

      .year {
        display: none;
      }

      .close-button {
        top: 18px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .cover-motion {
        display: none !important;
      }

      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
        transition-delay: 0ms !important;
      }
    }
  </style>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      // Data dictionary for the 3 Books
      const books = {
        intro: {
          title: "Volume I · Identity",
          year: "2026",
          kicker: "Field Manual · I",
          description:
            "I am Samrit Kumar Bhutia — a Full-Stack AI Engineer and Creative Software Developer. I engineer deep learning diagnostic platforms, autonomous developer agent loops, and high-performance web systems.",
          steps: [
            {
              title: "Foundation & Specialization",
              body: "B.Tech in Computer Science with a strong background in applied Computer Vision, full-stack architectures, and autonomous LLM workflows."
            },
            {
              title: "The Engineering Craft",
              body: "I bridge complex mathematical algorithms and high-speed tensor inference with silky, responsive, human-centered interfaces."
            },
            {
              title: "Active Horizons",
              body: "Exploring production convolutional neural networks (ResNet), agentic CI/CD pipelines, and robust full-stack applications with MERN & FastAPI."
            },
            {
              title: "Open Availability",
              body: "Available for full-time engineering roles, AI projects, and visionary software initiatives across the globe."
            }
          ],
          prompt:
            "Engineer systems that are not only computationally sound, but structurally resilient, beautiful to use, and purposeful.",
          review:
            "Location: India • Global & Remote Ready • Direct transmission: samritonline@gmail.com • GitHub: github.com/Samritcodes"
        },
        projects: {
          title: "Volume II · Selected Works",
          year: "2024 — 2026",
          kicker: "Field Manual · II",
          description:
            "An annotated compendium of production deep learning models, autonomous agent systems, full-stack SaaS engines, and algorithmic tools.",
          // Rich interactive project cards with direct GitHub links
          projectsList: [
            {
              title: "AgriSense AI — Foliage Crop Pathology Engine",
              desc: "Sub-second agricultural diagnostic engine powered by a fine-tuned ResNet CNN. Identifies 28 foliar crop pathologies in < 200ms with differential diagnosis, spray dosage calculators, and 2.5x virtual microscope.",
              tags: ["React 19", "FastAPI", "TensorFlow", "ResNet", "Tailwind v4"],
              link: "https://github.com/Samritcodes/AgriSense"
            },
            {
              title: "CodeSprint AI — Autonomous Coding Agent Pipeline",
              desc: "Automated agent workflow that assigns daily LeetCode/DSA problems, waits for developer git commits, evaluates time/space complexity, and auto-generates comprehensive repository documentation.",
              tags: ["GitHub Actions", "Node.js", "Agentic Loop", "DSA"],
              link: "https://github.com/Samritcodes/CodeSprint-AI"
            },
            {
              title: "AI Resume & ATS Checker",
              desc: "Full-stack MERN platform that extracts text from PDF resumes, scores ATS readiness (0–100) using Google Gemini AI, identifies weak points, and rewrites bullet points with side-by-side diff tracking.",
              tags: ["Google Gemini AI", "MERN Stack", "pdf-parse", "Tailwind"],
              link: "https://github.com/Samritcodes/AI-Resume-Checker"
            },
            {
              title: "EcoTrack — Gamified Carbon Footprint Engine",
              desc: "Comprehensive sustainability tracking platform featuring real-world emission calculations across transport, energy, and diet, with streak tracking, Chart.js trends, and community leaderboards.",
              tags: ["React", "Node.js", "Express", "MongoDB", "Chart.js"],
              link: "https://github.com/Samritcodes/Ecotrac"
            },
            {
              title: "Session & Subscription Manager",
              desc: "Production-ready RESTful authentication and tier-subscription management microservice with httpOnly cookies, password hashing, and MongoDB aggregation pipelines.",
              tags: ["Node.js", "Express", "MongoDB", "JWT Auth", "Bcrypt"],
              link: "https://github.com/Samritcodes/session-manager"
            },
            {
              title: "Plant Disease Prediction (Random Forest)",
              desc: "Machine learning classifier using Scikit-Learn ensemble Random Forests to predict agricultural pathologies from multi-spectral environmental metrics.",
              tags: ["Python", "Scikit-Learn", "Random Forest", "ML"],
              link: "https://github.com/Samritcodes/plant-disease-prediction-RandomForest"
            },
            {
              title: "BFS Pathfinding & SHA-256 Digest Visualizer",
              desc: "Interactive algorithmic simulators demonstrating Breadth-First Search graph traversal and cryptographic hashing avalanche effects.",
              tags: ["Graph Theory", "Algorithms", "Cryptography", "JavaScript"],
              link: "https://github.com/Samritcodes"
            }
          ],
          prompt:
            "Build verified systems. Every repository here represents a live, functioning solution designed for measurable impact.",
          review:
            "All repositories are open for inspection and code review on GitHub @Samritcodes."
        },
        skills: {
          title: "Volume III · Technical Arsenal",
          year: "2026 Edition",
          kicker: "Field Manual · III",
          description:
            "A comprehensive index of programming languages, deep learning frameworks, frontend ecosystems, backends, databases, and DevOps tools.",
          steps: [
            {
              title: "Languages & Foundational Paradigms",
              body: "Python, JavaScript (ESNext), TypeScript, C, HTML5, modern CSS / Tailwind, SQL."
            },
            {
              title: "Machine Learning & Computer Vision",
              body: "TensorFlow / Keras, ResNet, OpenCV, Scikit-Learn, Google Gemini AI API, FastAPI Tensor Inferences."
            },
            {
              title: "Frontend Engineering & Creative Tech",
              body: "React 19, Next.js, Vite, Three.js, Tailwind CSS."
            },
            {
              title: "Backend Architecture & Databases",
              body: "Node.js, Express.js, FastAPI, MongoDB (Mongoose), PostgreSQL, RESTful API design, JWT auth."
            },
            {
              title: "DevOps & Tooling Workflows",
              body: "Docker(Basics), GitHub Actions CI/CD, Git, Postman, Vercel, Netlify."
            }
          ],
          prompt:
            "Choose tools not for novelty, but for leverage, performance, and long-term maintainability.",
          review:
            "Continuously learning, evolving, and expanding technical horizons with every deployed line of code."
        }
      };

      const body = document.body;
      const stage = document.querySelector(".stage");
      const cards = [...document.querySelectorAll(".book-card")];
      const detailPanel = document.querySelector("#detailPanel");
      const detailTitle = document.querySelector("#detailTitle");
      const detailScroll = document.querySelector("#detailScroll");
      const detailDescription = document.querySelector("#detailDescription");
      const detailCustomArea = document.querySelector("#detailCustomArea");
      const detailPrompt = document.querySelector("#detailPrompt");
      const detailReview = document.querySelector("#detailReview");
      const detailYear = document.querySelector("#detailYear");
      const detailKicker = document.querySelector("#detailKicker");
      const closeButton = document.querySelector("#closeButton");
      const menuButton = document.querySelector("#menuButton");
      const menuLayer = document.querySelector("#menuLayer");
      const saveButton = document.querySelector("#saveButton");
      const toast = document.querySelector("#toast");
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      const coverVideos = [...document.querySelectorAll(".cover-motion")];
      let selectedCard = null;
      let toastTimer = 0;
      let frame = 0;
      let pointerX = 0;
      let pointerY = 0;
      let pointerClientX = -10000;
      let pointerClientY = -10000;

      function showToast(message) {
        window.clearTimeout(toastTimer);
        toast.textContent = message;
        toast.dataset.show = "true";
        toastTimer = window.setTimeout(() => {
          toast.dataset.show = "false";
        }, 2200);
      }

      function syncCoverMotion() {
        coverVideos.forEach((video) => {
          const card = video.closest(".book-card");
          const isVisibleBook =
            body.dataset.mode === "gallery" ||
            (body.dataset.mode === "detail" && card === selectedCard);
          const shouldPlay =
            !reducedMotion.matches &&
            !document.hidden &&
            isVisibleBook;

          if (!shouldPlay) {
            video.pause();
            return;
          }

          const playRequest = video.play();
          if (playRequest) playRequest.catch(() => {});
        });
      }

      function updateParallax() {
        frame = 0;
        if (reducedMotion.matches) return;

        if (body.dataset.mode === "detail" && selectedCard) {
          const bounds = selectedCard.getBoundingClientRect();
          const bookCenterX = bounds.left + bounds.width / 2;
          const bookCenterY = bounds.top + bounds.height / 2;
          const isPointerInViewport =
            pointerClientX >= 0 &&
            pointerClientX <= window.innerWidth &&
            pointerClientY >= 0 &&
            pointerClientY <= window.innerHeight;
          const horizontalReach = pointerClientX < bookCenterX
            ? Math.max(bookCenterX, 1)
            : Math.max(window.innerWidth - bookCenterX, 1);
          const verticalReach = pointerClientY < bookCenterY
            ? Math.max(bookCenterY, 1)
            : Math.max(window.innerHeight - bookCenterY, 1);
          const viewportX = isPointerInViewport
            ? Math.max(-1, Math.min(1, (pointerClientX - bookCenterX) / horizontalReach))
            : -5 / 16;
          const viewportY = isPointerInViewport
            ? Math.max(-1, Math.min(1, (pointerClientY - bookCenterY) / verticalReach))
            : 0;
          selectedCard.style.setProperty("--detail-yaw", `${viewportX * 16}deg`);
          selectedCard.style.setProperty("--detail-pitch", `${viewportY * -10}deg`);
          selectedCard.dataset.orbiting = String(isPointerInViewport);
          return;
        }

        if (body.dataset.mode !== "gallery") return;

        document.documentElement.style.setProperty("--mx", `${pointerX * 11}px`);
        document.documentElement.style.setProperty("--my", `${pointerY * 8}px`);

        cards.forEach((card, index) => {
          const depth = index === 1 ? 1 : .58;
          card.style.setProperty("--local-x", `${pointerX * 15 * depth}px`);
          card.style.setProperty("--local-y", `${pointerY * 9 * depth}px`);
        });
      }

      function selectBook(card) {
        if (body.dataset.mode === "detail") return;
        const data = books[card.dataset.book];
        if (!data) return;

        selectedCard = card;
        selectedCard.style.setProperty("--detail-yaw", "-5deg");
        selectedCard.style.setProperty("--detail-pitch", "0deg");
        selectedCard.dataset.orbiting = "false";
        detailTitle.textContent = data.title;
        detailDescription.textContent = data.description;
        detailYear.textContent = data.year;
        detailKicker.textContent = data.kicker;

        // Render projects list for Book 2 or structured steps for Books 1 & 3
        detailCustomArea.innerHTML = "";
        if (data.projectsList) {
          const section = document.createElement("section");
          section.className = "doc-section";
          section.innerHTML = `
            <p class="doc-label">Featured Projects (${data.projectsList.length})</p>
            <div style="display: grid; gap: 14px;">
              ${data.projectsList.map(p => `
                <div class="project-entry">
                  <div class="project-header">
                    <span class="project-title">${p.title}</span>
                    <a href="${p.link}" target="_blank" rel="noopener noreferrer" class="project-link">
                      <i class="fa-brands fa-github"></i> Repository
                    </a>
                  </div>
                  <p style="margin: 0; color: var(--muted); font-size: 13.5px; line-height: 1.56;">${p.desc}</p>
                  <div class="project-tags">
                    ${p.tags.map(t => `<span class="tag-badge">${t}</span>`).join('')}
                  </div>
                </div>
              `).join('')}
            </div>
          `;
          detailCustomArea.appendChild(section);
        } else if (data.steps) {
          const section = document.createElement("section");
          section.className = "doc-section";
          section.innerHTML = `
            <p class="doc-label">Core Pillars</p>
            <ol class="doc-steps">
              ${data.steps.map(s => `
                <li>
                  <span class="doc-step-copy">
                    <strong>${s.title}</strong>
                    <span>${s.body}</span>
                  </span>
                </li>
              `).join('')}
            </ol>
          `;
          detailCustomArea.appendChild(section);
        }

        detailPrompt.textContent = data.prompt;
        detailReview.textContent = data.review;
        detailScroll.scrollTop = 0;

        cards.forEach((item) => item.classList.toggle("selected", item === card));
        cards.forEach((item) => { item.tabIndex = -1; });
        body.dataset.mode = "detail";
        syncCoverMotion();
        detailPanel.setAttribute("aria-hidden", "false");
        detailPanel.inert = false;
        closeButton.tabIndex = 0;
        saveButton.setAttribute("aria-pressed", "false");
        window.setTimeout(() => {
          closeButton.focus({ preventScroll: true });
          if (window.innerWidth > 900) stage.scrollTop = 0;
        }, reducedMotion.matches ? 0 : 700);
      }

      function closeDetail() {
        if (body.dataset.mode !== "detail") return;
        body.dataset.mode = "gallery";
        syncCoverMotion();
        detailPanel.setAttribute("aria-hidden", "true");
        detailPanel.inert = true;
        closeButton.tabIndex = -1;
        const lastCard = selectedCard;
        lastCard?.style.setProperty("--detail-yaw", "-5deg");
        lastCard?.style.setProperty("--detail-pitch", "0deg");
        if (lastCard) lastCard.dataset.orbiting = "false";
        window.setTimeout(() => {
          cards.forEach((card) => card.classList.remove("selected"));
          cards.forEach((card) => { card.tabIndex = 0; });
          selectedCard = null;
          lastCard?.focus({ preventScroll: true });
          if (window.innerWidth > 900) stage.scrollTop = 0;
        }, reducedMotion.matches ? 0 : 700);
      }

      function toggleMenu(force) {
        const willOpen = typeof force === "boolean"
          ? force
          : body.dataset.menu !== "open";
        body.dataset.menu = willOpen ? "open" : "closed";
        menuLayer.inert = !willOpen;
        menuButton.setAttribute("aria-expanded", String(willOpen));
        menuButton.setAttribute("aria-label", willOpen ? "Close menu" : "Open menu");
      }

      cards.forEach((card) => {
        card.addEventListener("click", () => selectBook(card));
        card.addEventListener("pointerenter", () => card.dataset.hovered = "true");
        card.addEventListener("pointerleave", () => card.dataset.hovered = "false");
      });

      coverVideos.forEach((video) => {
        const revealVideo = () => { video.dataset.ready = "true"; };
        if (video.readyState >= 2) {
          revealVideo();
        } else {
          video.addEventListener("loadeddata", revealVideo, { once: true });
        }
      });

      document.addEventListener("visibilitychange", syncCoverMotion);
      if (reducedMotion.addEventListener) {
        reducedMotion.addEventListener("change", syncCoverMotion);
      } else {
        reducedMotion.addListener(syncCoverMotion);
      }
      syncCoverMotion();

      window.addEventListener("pointermove", (event) => {
        pointerX = event.clientX / window.innerWidth - .5;
        pointerY = event.clientY / window.innerHeight - .5;
        pointerClientX = event.clientX;
        pointerClientY = event.clientY;
        if (!frame) frame = window.requestAnimationFrame(updateParallax);
      }, { passive: true });

      window.addEventListener("pointerleave", () => {
        pointerX = 0;
        pointerY = 0;
        pointerClientX = -10000;
        pointerClientY = -10000;
        if (!frame) frame = window.requestAnimationFrame(updateParallax);
      });

      closeButton.addEventListener("click", closeDetail);
      menuButton.addEventListener("click", () => toggleMenu());

      saveButton.addEventListener("click", () => {
        const saved = saveButton.getAttribute("aria-pressed") !== "true";
        saveButton.setAttribute("aria-pressed", String(saved));
        showToast(saved ? "Volume bookmarked to reading list." : "Removed from reading list.");
      });

      document.addEventListener("click", (event) => {
        const toastTarget = event.target.closest("[data-toast]");
        if (toastTarget) {
          event.preventDefault();
          showToast(toastTarget.dataset.toast);
        }

        const menuAction = event.target.closest("[data-menu-action]");
        if (menuAction) {
          event.preventDefault();
          const bookKey = menuAction.dataset.menuAction;
          toggleMenu(false);
          const targetCard = cards.find(c => c.dataset.book === bookKey);
          if (targetCard) {
            closeDetail();
            setTimeout(() => selectBook(targetCard), 350);
          }
        }
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          if (body.dataset.menu === "open") {
            toggleMenu(false);
          } else {
            closeDetail();
          }
        }
      });
    })();
  </script>
